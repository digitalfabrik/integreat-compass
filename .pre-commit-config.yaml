repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md,markdown"]
        exclude: .github/PULL_REQUEST_TEMPLATE.md
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.5
    hooks:
      - id: shellcheck
        args: [--external-sources]
  # Run the project's own ESLint/Prettier (flat config, see package.json) so the
  # hooks always match the installed versions instead of separately pinned mirrors.
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --fix --no-error-on-unmatched-pattern
        language: system
        files: \.[jt]sx?$
        types: [file]
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        files: \.(jsx?|tsx?|css|s[ac]ss|json|ya?ml|md|markdown|html)$
  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.31.1
    hooks:
      - id: djlint-django
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
