[project.urls]
"Source Code" = "https://github.com/digitalfabrik/integreat-compass"
"Issues" = "https://github.com/digitalfabrik/integreat-compass/issues"

[tool.setuptools]
script-files = ["integreat_compass/integreat-compass-cli"]
license-files = ["LICENSE", "NOTICE.md"]

[tool.setuptools.dynamic]
version = { attr = "integreat_compass.__version__" }

[tool.setuptools.packages.find]
include = ["integreat_compass*"]

[tool.bumpver]
current_version = "2023.3.0"
version_pattern = "YYYY.MM.INC0[-TAG]"
commit_message = """
Bump version to {new_version}

[skip ci]
"""


[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
]
"integreat_compass/__init__.py" = [
    '__version__ = "{version}"',
]
"docs/src/conf.py" = [
    'release = "{version}"',
]

[tool.black]
skip-magic-trailing-comma = true

[tool.djlint]
profile="django"

[tool.isort]
profile = "black"
order_by_type = false

[tool.pylint.main]
# Do not use jobs = 0: in CI containers multiprocessing.cpu_count() returns the
# host CPU count, spawning dozens of workers that OOM the small runner.
jobs = 1
load-plugins = [
    "pylint_django",
    "pylint_per_file_ignores",
    "pylint.extensions.code_style",
    "pylint.extensions.comparetozero",
    "pylint.extensions.comparison_placement",
    "pylint.extensions.consider_ternary_expression",
    "pylint.extensions.docparams",
    "pylint.extensions.emptystring",
    "pylint.extensions.for_any_all",
]
enable = [
    "consider-using-augmented-assign",
]
disable = [
    "consider-using-namedtuple-or-dataclass",
    "consider-using-tuple",
]
recursive = true
ignore-paths = [
  ".venv",
  "node_modules",
  "build",
]
fail-on = "I"
django-settings-module="integreat_compass.core.settings"

[tool.pylint.design]
max-args = 7
max-attributes = 7
max-branches = 12
max-locals = 15
max-parents = 7

[tool.pylint.messages_control]
disable = [
    "invalid-name",
    "line-too-long",
    "too-many-lines",
    "missing-module-docstring",
    "no-member",
    "unsupported-binary-operation",
    "deprecated-module",
]
enable = [
    "useless-suppression"
]

[tool.pylint.reports]
output-format = "colorized"

[tool.pylint-per-file-ignores]
"/tests/"="unused-argument,missing-function-docstring"
